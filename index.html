<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>準備中</title>

    <style>
      :root {
        --site-primary: #e7a8b8;
        --site-secondary: #f8dde4;
        --site-background: #fff4f6;
        --site-on-primary: #ffffff;
        --site-on-secondary: #5c3741;
        --site-on-background: #49343a;
        --site-font-body: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
        --site-font-heading: "Hiragino Mincho ProN", "Yu Mincho", serif;
        --site-heading-scale: 1;
        --site-spacing-scale: 1;
        --site-radius-scale: 1;
        --site-decoration-opacity: 1;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        font-family: var(--site-font-body);
        color: var(--site-on-background);
        background: var(--site-background);
      }

      #app {
        min-height: 100vh;
        background-color: var(--site-background);
        position: relative;
        overflow: hidden;
        display: grid;
        place-items: center;
        padding: calc(32px * var(--site-spacing-scale));
        border-radius: 0;
      }

      main {
        width: min(680px, 100%);
        text-align: center;
        position: relative;
        z-index: 1;
      }

      h1 {
        margin: 0;
        color: var(--site-on-background);
        font-family: var(--site-font-heading);
        font-size: clamp(32px, 7vw, 48px);
        font-weight: 500;
        letter-spacing: 0.08em;
        line-height: 1.35;
      }

      .message {
        margin: calc(22px * var(--site-spacing-scale)) auto 0;
        max-width: 500px;
        font-size: 15px;
        line-height: 2;
        color: var(--site-on-secondary);
        overflow-wrap: anywhere;
      }

      .sub {
        margin: 0;
        font-size: 12px;
        letter-spacing: 0.12em;
        color: var(--site-on-secondary);
        opacity: 0.72;
      }

      @media (max-width: 600px) {
        #app {
          padding: calc(24px * var(--site-spacing-scale));
        }

        .message {
          font-size: 14px;
        }
      }
    </style>
  </head>

  <body>
    <div id="app">
      <main>
        <h1>現在、非公開中です。</h1>

        <p class="message">
          このウェブサイトは現在、準備・調整のため一時的に非公開にしています。<br />
          公開まで、もうしばらくお待ちください。
        </p>

        <p class="sub">Thank you for your patience.</p>
      </main>
    </div>
  </body>
</html>
